name: Smoke test

# Runs the whole prediction chain on every push and PR, on a plain CPU runner: synthetic
# pack -> ORF track -> BOTH released checkpoints -> density. See scripts/smoke_test.py for
# what it asserts and, more to the point, what it does not.
#
# It exists because the repository had no test of any kind, and the README quickstart was
# broken in three independent ways for long enough to be released that way. Anything that
# breaks loading a checkpoint, resolving a path, or the feature layout fails here in about
# two minutes.
#
# No GPU, and none needed: mamba4 falls back to scripts/mamba_ref.py.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # Compiling the pipeline catches what a reviewer will not: Nextflow 26 rejects top-level
  # statements, and Groovy parses `(int)(x/10)` as a call to `int`. Both got through review and
  # died in a scheduled job minutes in. Seconds here, no containers, no data.
  nextflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Nextflow
        run: |
          curl -sSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version
      - name: Compile the pipeline
        run: nextflow run . --help
      - name: Every module compiles and declares its container-side entry points
        run: |
          # The modules call scripts by bare name. If one is renamed and a module is not
          # updated, the failure otherwise lands mid-run in a task work directory.
          miss=0
          for t in measure_adapter.py rnaseq_coverage.py ribo_psites.py build_pack.py \
                   build_orf_track.py dump_pred_profiles.py ribocode_dropin.py \
                   ribotish_dropin.py score_demo.py; do
            find scripts -maxdepth 2 -name "$t" | grep -q . || { echo "MISSING: $t"; miss=1; }
          done
          exit $miss

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'      # the version containers/Dockerfile.riboseq-model pins

      # The weights are ~50 MB and change only when a checkpoint is re-released.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-emalek-RiboSignal

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "numpy<2" huggingface_hub

      - name: ORF-caller regression tests
        run: python tests/test_orfcallers.py     # stdlib only; no bam, no genome

      - name: mamba_ref self-test
        run: python scripts/mamba_ref.py

      - name: End-to-end smoke test
        run: python scripts/smoke_test.py --download --workdir "$RUNNER_TEMP/smoke"
