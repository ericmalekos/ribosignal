name: Publish riboseq-model image

# Builds the project images that run the whole riboseq_signal_model chain for BOTH mixers,
# replacing the borrowed rnazoo model images (see containers/riboseq-model.def for why).
#
# TWO images from ONE Dockerfile, via build args, so their pins cannot drift apart:
#   :gpu  CUDA base, cu118 torch, the prebuilt mamba_ssm CUDA kernels
#   :cpu  ubuntu base, cpu torch, no mamba_ssm; mamba4 runs the pure-PyTorch reference,
#         which matches the CUDA kernel to 1.19e-07 max abs diff
# :latest tracks :gpu, which is what it has always been.
#
# Mirrors RNA-Zoo's publish-images.yml: ghcr.io/ericmalekos, GITHUB_TOKEN auth, sha-tag on branch
# pushes and the git tag on v* releases, plus :latest.
#
# On main, only fires when the image definition or this workflow changes -- a CUDA base plus torch
# plus the mamba wheels is a long build, and nothing else in the repo affects it.
#
# The v* tag trigger lives in release-image.yml, which calls this workflow, and NOT in the push
# block below. `branches`/`tags` and `paths` are ANDed, so a `tags: [v*]` entry here would build a
# release only when that same push also happened to touch containers/ -- which is to say almost
# never. Splitting the trigger is what makes a tag build unconditional.

on:
  push:
    branches: [main]
    paths:
      - 'containers/Dockerfile.riboseq-model'
      - 'containers/riboseq-model.def'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ericmalekos
  IMAGE_NAME: riboseq-model

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gpu
            base: nvidia/cuda:11.8.0-cudnn8-devel-ubuntu22.04
            torch_index: https://download.pytorch.org/whl/cu118
            with_cuda_mamba: "1"
          - variant: cpu
            base: ubuntu:22.04
            torch_index: https://download.pytorch.org/whl/cpu
            with_cuda_mamba: "0"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The CUDA devel base plus torch plus the mamba wheels overrun the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          IMG="${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            echo "${IMG}:${VERSION}-${{ matrix.variant }}"
            echo "${IMG}:${{ matrix.variant }}"
            # :latest is the gpu image, unchanged from before the split. An `&&` here would
            # make the block exit 1 on the cpu variant and fail that leg of the matrix.
            if [ "${{ matrix.variant }}" = gpu ]; then echo "${IMG}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.riboseq-model
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE=${{ matrix.base }}
            TORCH_INDEX=${{ matrix.torch_index }}
            WITH_CUDA_MAMBA=${{ matrix.with_cuda_mamba }}
          # The image bakes in the released weights from Hugging Face. emalek/RiboSignal is
          # public, so this resolves to an empty value and the fetch is anonymous. It is passed
          # as a build SECRET rather than a build arg: build args are written into the image
          # metadata and `docker history` reads them straight back out, so a fork that set this
          # to a real token -- the only reason the input exists -- would have published it.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
