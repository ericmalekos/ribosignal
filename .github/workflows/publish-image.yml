name: Publish riboseq-model image

# Builds the ONE project image that runs the whole riboseq_signal_model chain for BOTH mixers,
# replacing the borrowed rnazoo model images (see containers/riboseq-model.def for why).
#
# Mirrors RNA-Zoo's publish-images.yml: ghcr.io/ericmalekos, GITHUB_TOKEN auth, sha-tag on branch
# pushes and the git tag on v* releases, plus :latest.
#
# Only fires when the image definition or this workflow changes -- a CUDA base plus torch plus the
# mamba wheels is a long build, and nothing else in the repo affects it.

on:
  push:
    branches: [main]
    paths:
      - 'containers/Dockerfile.riboseq-model'
      - 'containers/riboseq-model.def'
      - '.github/workflows/publish-image.yml'
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ericmalekos
  IMAGE_NAME: riboseq-model

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The CUDA devel base plus torch plus the mamba wheels overrun the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          {
            echo "tags<<EOF"
            echo "${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:${VERSION}"
            echo "${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.riboseq-model
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The image bakes in the released weights from Hugging Face. While
          # emalek/RiboSignal is PRIVATE this needs a token; once the repo is public the
          # secret can be removed and the build works with an empty value.
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
